[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tic_tac_learn"
version = "0.1.2"
description = "Learning agent for tick tac toe game : https://github.com/andrewbeaton123/tic_tac_toe_game "
authors = ["Andrew Beaton"]
packages = [
    { include = "tic_tac_learn", from = "." }
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "*"
mlflow = "*"
tqdm = "*"
recordclass = "*"
tic-tac-toe-game = { git = "https://github.com/andrewbeaton123/tic_tac_toe_game.git", branch ='engine-improvements'} #rev = "223ac92c87e360b06ba3dca543a3f25202237c28" }

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-cov = "*"